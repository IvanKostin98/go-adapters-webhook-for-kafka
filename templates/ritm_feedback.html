<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Спасибо за оценку</title>
  <style>
    :root {
      color-scheme: light;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f8ff;
      color: #10213a;
    }
    .card {
      width: min(420px, calc(100vw - 32px));
      background: #ffffff;
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 10px 30px rgba(16, 33, 58, 0.12);
      text-align: center;
    }
    .heart {
      font-size: 46px;
      line-height: 1;
      color: #2563eb;
      margin-bottom: 14px;
    }
    h1 {
      font-size: 24px;
      margin: 0;
      font-weight: 700;
    }
    p {
      margin: 10px 0 0;
      font-size: 15px;
      color: #4a5a74;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="heart" aria-hidden="true">💙</div>
    <h1>Спасибо за вашу оценку</h1>
    <p>Ваш ответ сохранен.</p>
  </main>
</body>
</html>
